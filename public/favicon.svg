<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#1E3327"/>
      <stop offset="100%" stop-color="#0F1712"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    width="64"
    height="64"
    rx="16"
    fill="url(#bg)"
  />

  <!-- Document -->
  <g filter="url(#shadow)">
    <path
      d="M18 12H39L48 21V50C48 51.1 47.1 52 46 52H18C16.9 52 16 51.1 16 50V14C16 12.9 16.9 12 18 12Z"
      fill="#F7FAF7"
    />

    <!-- Fold -->
    <path
      d="M39 12V19C39 20.1 39.9 21 41 21H48"
      fill="#DDE8DE"
    />
  </g>

  <!-- Ledger Accent Bar -->
  <rect
    x="16"
    y="12"
    width="5"
    height="40"
    rx="2.5"
    fill="#4CAF6C"
  />

  <!-- Ledger Lines -->
  <line x1="26" y1="27" x2="41" y2="27"
        stroke="#8BA390"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <line x1="26" y1="34" x2="41" y2="34"
        stroke="#8BA390"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <line x1="26" y1="41" x2="36" y2="41"
        stroke="#8BA390"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- L Symbol -->
  <path
    d="M27 19V44H39"
    stroke="#1E8E5A"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>